trigger: none
pr: none

resources:
  pipelines:
    - pipeline: webBuild
      source: azure-pipelines-web
      trigger:
        branches:
          include:
            - main

pool:
  name: Self Hosted

steps:
  - checkout: none

  - download: webBuild
    artifact: web

  - task: PowerShell@2
    displayName: Extract website to demo
    inputs:
      targetType: inline
      pwsh: false
      script: |
        $demo = Join-Path "$(Pipeline.Workspace)" "demo"
        if (Test-Path $demo) { Remove-Item $demo -Recurse -Force }
        New-Item -ItemType Directory -Path $demo -Force | Out-Null
        Expand-Archive -Path "$(Pipeline.Workspace)\webBuild\web\web.zip" -DestinationPath $demo -Force

  - task: PowerShell@2
    displayName: Copy extracted files to D:\jhbdemo
    inputs:
      targetType: inline
      pwsh: false
      script: |
        $target = "D:\jhbdemo"
        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Copy-Item -Path (Join-Path "$(Pipeline.Workspace)" "demo\*") -Destination $target -Recurse -Force

  - task: PowerShell@2
    displayName: List D:\jhbdemo files
    inputs:
      targetType: inline
      pwsh: false
      script: Get-ChildItem -Path "D:\jhbdemo" -Recurse -File | Select-Object -ExpandProperty FullName
