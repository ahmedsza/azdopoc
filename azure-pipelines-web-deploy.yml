trigger: none
pr: none

resources:
  pipelines:
    - pipeline: webBuild
      source: azure-pipelines-web
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none

  - download: webBuild
    artifact: web

  - script: |
      mkdir -p "$(Pipeline.Workspace)/demo"
      unzip "$(Pipeline.Workspace)/webBuild/web/web.zip" -d "$(Pipeline.Workspace)/demo"
    displayName: Extract website to demo

  - script: find "$(Pipeline.Workspace)/demo" -type f -print
    displayName: List demo files
