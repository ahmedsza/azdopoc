trigger: none
pr: none

resources:
  pipelines:
    - pipeline: webBuild
      source: azure-pipelines-web
      trigger:
        branches:
          include:
            - master

pool:
  name: SelfHosted

variables:
  - group: PropertyManagement-Sql
  - name: siteName
    value: jhbdemo
  - name: appPoolName
    value: jhbdemo
  - name: sitePath
    value: D:\jhbdemo
  - name: sitePort
    value: 8080

stages:
  - stage: Deploy
    displayName: Deploy website
    lockBehavior: sequential
    jobs:
      - deployment: DeployWebsite
        displayName: Deploy website to IIS
        environment: property-management-sql
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: none

              - download: webBuild
                artifact: web

              - task: PowerShell@2
                displayName: Extract website to demo
                inputs:
                  targetType: inline
                  pwsh: false
                  script: |
                    $demo = Join-Path "$(Pipeline.Workspace)" "demo"
                    if (Test-Path $demo) { Remove-Item $demo -Recurse -Force }
                    New-Item -ItemType Directory -Path $demo -Force | Out-Null
                    Expand-Archive -Path "$(Pipeline.Workspace)\webBuild\web\web.zip" -DestinationPath $demo -Force

              - task: PowerShell@2
                displayName: Ensure $(sitePath) exists
                inputs:
                  targetType: inline
                  pwsh: false
                  script: New-Item -ItemType Directory -Path "$(sitePath)" -Force | Out-Null

              # Creates the site and app pool on first run; updates them on later runs.
              - task: IISWebAppManagementOnMachineGroup@0
                displayName: Create or update IIS website and app pool
                inputs:
                  IISDeploymentType: IISWebsite
                  ActionIISWebsite: CreateOrUpdateWebsite
                  WebsiteName: $(siteName)
                  WebsitePhysicalPath: $(sitePath)
                  WebsitePhysicalPathAuth: WebsiteUserPassThrough
                  AddBinding: true
                  Bindings: '{"bindings":[{"protocol":"http","ipAddress":"All Unassigned","hostname":"","port":"$(sitePort)","sslThumbprint":"","sniFlag":false}]}'
                  CreateOrUpdateAppPoolForWebsite: true
                  AppPoolNameForWebsite: $(appPoolName)
                  DotNetVersionForWebsite: No Managed Code
                  PipeLineModeForWebsite: Integrated
                  AppPoolIdentityForWebsite: ApplicationPoolIdentity

              - task: IISWebAppManagementOnMachineGroup@0
                displayName: Stop app pool
                inputs:
                  IISDeploymentType: IISApplicationPool
                  ActionIISApplicationPool: StopAppPool
                  StartStopRecycleAppPoolName: $(appPoolName)

              - task: PowerShell@2
                displayName: Copy extracted files to $(sitePath)
                inputs:
                  targetType: inline
                  pwsh: false
                  script: |
                    Start-Sleep -Seconds 5  # give w3wp time to release file locks
                    Copy-Item -Path (Join-Path "$(Pipeline.Workspace)" "demo\*") -Destination "$(sitePath)" -Recurse -Force
                    icacls "$(sitePath)" /grant "IIS AppPool\$(appPoolName):(OI)(CI)RX" /T /Q | Out-Null

              - task: PowerShell@2
                displayName: Configure website database connection
                inputs:
                  targetType: inline
                  pwsh: false
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $connectionString = $env:WEB_SQL_CONNECTION_STRING
                    if ([string]::IsNullOrWhiteSpace($connectionString) -or $connectionString -match '^\$\(.+\)$') {
                      throw 'Configure the secret SqlDeploymentConnectionString in the PropertyManagement-Sql variable group.'
                    }

                    $path = Join-Path "$(sitePath)" "appsettings.json"
                    $settings = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
                    if ($null -eq $settings.ConnectionStrings) {
                      $settings | Add-Member -NotePropertyName ConnectionStrings -NotePropertyValue ([pscustomobject]@{}) -Force
                    }
                    $settings.ConnectionStrings | Add-Member -NotePropertyName PropertyManagement -NotePropertyValue $connectionString -Force
                    $settings | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $path -Encoding UTF8
                env:
                  WEB_SQL_CONNECTION_STRING: $(SqlDeploymentConnectionString)

              - task: IISWebAppManagementOnMachineGroup@0
                displayName: Start app pool
                condition: always()
                inputs:
                  IISDeploymentType: IISApplicationPool
                  ActionIISApplicationPool: StartAppPool
                  StartStopRecycleAppPoolName: $(appPoolName)

              - task: PowerShell@2
                displayName: Smoke test http://localhost:$(sitePort)
                inputs:
                  targetType: inline
                  pwsh: false
                  script: |
                    $url = "http://localhost:$(sitePort)/"
                    for ($i = 1; $i -le 5; $i++) {
                      try {
                        $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
                        Write-Host "$url returned HTTP $($r.StatusCode)"
                        Write-Host "##vso[task.setvariable variable=WebSmokeTestSucceeded]true"
                        exit 0
                      } catch {
                        Write-Host "Attempt $i failed: $($_.Exception.Message)"
                        Start-Sleep -Seconds 5
                      }
                    }
                    Write-Host "##vso[task.logissue type=warning]Smoke test did not get a successful response from $url"

              - task: PowerShell@2
                displayName: Prepare release notes output
                condition: and(succeeded(), eq(variables['WebSmokeTestSucceeded'], 'true'))
                inputs:
                  targetType: inline
                  pwsh: true
                  script: New-Item -ItemType Directory -Path '$(Build.ArtifactStagingDirectory)/release-notes' -Force | Out-Null

              - task: XplatGenerateReleaseNotes@4
                displayName: Generate web deployment release notes
                condition: and(succeeded(), eq(variables['WebSmokeTestSucceeded'], 'true'))
                inputs:
                  outputfile: '$(Build.ArtifactStagingDirectory)/release-notes/release-notes.md'
                  templateLocation: Inline
                  inlinetemplate: |
                    # Web Deployment $(Build.BuildNumber)

                    - **Deployment run:** [$(Build.BuildNumber)]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId))
                    - **Environment:** property-management-sql
                    - **Site:** http://$(siteName):$(sitePort)
                    - **Web build:** [$(resources.pipeline.webBuild.runName)]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(resources.pipeline.webBuild.runID))
                    - **Source branch:** `$(resources.pipeline.webBuild.sourceBranch)`
                    - **Source commit:** `$(resources.pipeline.webBuild.sourceCommit)`
                    - **Completed:** {{buildDetails.finishTime}}
                    {{#if compareBuildDetails}}
                    - **Previous successful deployment:** {{compareBuildDetails.buildNumber}}
                    {{/if}}

                    ## Work Items ({{workItems.length}})
                    {{#forEach workItems}}
                    - [{{this.id}}]({{replace this.url "_apis/wit/workItems" "_workitems/edit"}}) - {{lookup this.fields 'System.Title'}}
                    {{/forEach}}

                    ## Pull Requests ({{pullRequests.length}})
                    {{#forEach pullRequests}}
                    - [#{{this.pullRequestId}}]({{replace (replace this.url "_apis/git/repositories" "_git") "pullRequests" "pullRequest"}}) - {{this.title}}
                    {{/forEach}}

                    ## Commits ({{commits.length}})
                    {{#forEach commits}}
                    - `{{truncate this.id 7}}` - {{get_only_message_firstline this.message}} ({{this.author.displayName}})
                    {{/forEach}}

                    ## Consumed Artifacts ({{consumedArtifacts.length}})
                    | Type | Version | Commits | Work items |
                    | --- | --- | ---: | ---: |
                    {{#forEach consumedArtifacts}}
                    | {{this.artifactType}} | {{this.versionName}} | {{#if this.commits}}{{this.commits.length}}{{else}}0{{/if}} | {{#if this.workitems}}{{this.workitems.length}}{{else}}0{{/if}} |
                    {{/forEach}}
                  checkStage: true
                  overrideStageName: Deploy
                  recursivelyCheckConsumedArtifacts: true
                  replaceFile: true
                  stopOnError: true
                  getParentsAndChildren: false
                  getAllParents: false
                  getIndirectPullRequests: false
                  searchCrossProjectForPRs: false
                  dumpPayloadToConsole: false
                  dumpPayloadToFile: false

              - task: PowerShell@2
                displayName: Publish release notes to project wiki
                condition: and(succeeded(), eq(variables['WebSmokeTestSucceeded'], 'true'))
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    if ([string]::IsNullOrWhiteSpace($env:SYSTEM_ACCESSTOKEN)) {
                      throw 'System.AccessToken is unavailable. Grant the pipeline Build Service identity access to the project wiki.'
                    }

                    $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
                    $connectionDataUrl = "$(System.CollectionUri)_apis/connectionData?connectOptions=1&lastChangeId=-1&lastChangeId64=-1"
                    try {
                      $connectionData = Invoke-RestMethod -Uri $connectionDataUrl -Headers $headers -Method Get
                      $pipelineIdentity = $connectionData.authenticatedUser.displayName
                    } catch {
                      $pipelineIdentity = 'the pipeline token identity'
                    }
                    if ([string]::IsNullOrWhiteSpace($pipelineIdentity)) {
                      $pipelineIdentity = 'the pipeline token identity'
                    }
                    Write-Host "Pipeline token identity: $pipelineIdentity"

                    $projectId = '$(System.TeamProjectId)'
                    $wikiRepositoryName = '$(System.TeamProject).wiki'
                    $repositoriesApiUrl = "$(System.CollectionUri)$projectId/_apis/git/repositories?includeHidden=true&api-version=7.1"
                    try {
                      $repositoryList = Invoke-RestMethod -Uri $repositoriesApiUrl -Headers $headers -Method Get
                    } catch {
                      throw "Could not query Git repositories as '$pipelineIdentity'. Verify project and Code read permissions. $($_.Exception.Message)"
                    }
                    $wikiRepository = @($repositoryList.value) |
                      Where-Object { $_.name -eq $wikiRepositoryName -and !$_.isDisabled } |
                      Select-Object -First 1
                    if ($null -eq $wikiRepository) {
                      Write-Host "##vso[task.logissue type=warning]Repository '$wikiRepositoryName' was not returned by repository enumeration. Trying its direct project-wiki Git URL."
                      $repositoryLocator = [Uri]::EscapeDataString($wikiRepositoryName)
                      $wikiBranch = 'wikiMaster'
                    } else {
                      $repositoryLocator = $wikiRepository.id
                      $wikiBranch = $wikiRepository.defaultBranch -replace '^refs/heads/', ''
                      if ([string]::IsNullOrWhiteSpace($wikiBranch)) { $wikiBranch = 'wikiMaster' }
                    }

                    $wikiUrl = "$(System.CollectionUri)$projectId/_git/$repositoryLocator"
                    $wikiRoot = Join-Path '$(Agent.TempDirectory)' 'property-management-wiki'
                    $pageName = 'Web-Build-$(resources.pipeline.webBuild.runID)-Deployment-$(Build.BuildId)'
                    $pageDirectory = Join-Path $wikiRoot 'Web-Deployment-Release-Notes'
                    $pagePath = Join-Path $pageDirectory "$pageName.md"
                    $indexPath = Join-Path $wikiRoot 'Web-Deployment-Release-Notes.md'

                    if (Test-Path $wikiRoot) { Remove-Item $wikiRoot -Recurse -Force }
                    $env:GIT_CONFIG_COUNT = '1'
                    $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
                    $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN"
                    git clone --branch $wikiBranch --single-branch $wikiUrl $wikiRoot
                    if ($LASTEXITCODE -ne 0) {
                      throw "Could not clone repository '$wikiRepositoryName' as '$pipelineIdentity'. Grant that identity Read and Contribute permissions in Wiki security."
                    }

                    New-Item -ItemType Directory -Path $pageDirectory -Force | Out-Null
                    Copy-Item '$(Build.ArtifactStagingDirectory)/release-notes/release-notes.md' $pagePath -Force

                    $pages = Get-ChildItem $pageDirectory -Filter '*.md' |
                      Sort-Object BaseName -Descending |
                      Select-Object -ExpandProperty BaseName
                    $index = @(
                      '# Web Deployment Release Notes'
                      ''
                      'Release notes are generated after each successful IIS deployment and smoke test.'
                      ''
                    )
                    $index += $pages | ForEach-Object { "- [$($_)](Web-Deployment-Release-Notes/$($_))" }
                    $index | Set-Content $indexPath -Encoding utf8
                    $pages | Set-Content (Join-Path $pageDirectory '.order') -Encoding utf8

                    $rootOrderPath = Join-Path $wikiRoot '.order'
                    $rootOrder = if (Test-Path $rootOrderPath) { @(Get-Content $rootOrderPath) } else { @() }
                    if ($rootOrder -notcontains 'Web-Deployment-Release-Notes') {
                      $rootOrder += 'Web-Deployment-Release-Notes'
                      $rootOrder | Set-Content $rootOrderPath -Encoding utf8
                    }

                    git -C $wikiRoot config user.email 'azure-pipelines@local'
                    git -C $wikiRoot config user.name 'Azure Pipelines'
                    git -C $wikiRoot add --all
                    git -C $wikiRoot diff --cached --quiet
                    if ($LASTEXITCODE -eq 0) {
                      Write-Host 'The wiki already contains these release notes.'
                      exit 0
                    }
                    if ($LASTEXITCODE -ne 1) { throw 'Could not inspect the staged wiki changes.' }

                    git -C $wikiRoot commit -m "[skip ci] Publish web deployment notes for build $(resources.pipeline.webBuild.runID)"
                    if ($LASTEXITCODE -ne 0) { throw 'Could not commit the wiki update.' }
                    git -C $wikiRoot pull --rebase origin $wikiBranch
                    if ($LASTEXITCODE -ne 0) { throw 'Could not rebase the wiki update.' }
                    git -C $wikiRoot push origin "HEAD:$wikiBranch"
                    if ($LASTEXITCODE -ne 0) { throw 'Could not push the wiki update.' }
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)

              - task: PublishPipelineArtifact@1
                displayName: Publish web deployment release notes
                condition: and(succeeded(), eq(variables['WebSmokeTestSucceeded'], 'true'))
                inputs:
                  targetPath: '$(Build.ArtifactStagingDirectory)/release-notes'
                  artifactName: release-notes
