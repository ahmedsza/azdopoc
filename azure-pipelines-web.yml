trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  webProject: src/PropertyManagement.Web/PropertyManagement.Web.csproj

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore $(webProject)
    displayName: Restore

  - script: dotnet build $(webProject) --configuration $(buildConfiguration) --no-restore
    displayName: Build

  - script: dotnet publish $(webProject) --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/web
    displayName: Publish website

  - task: PublishPipelineArtifact@1
    displayName: Publish website artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/web
      artifactName: web
